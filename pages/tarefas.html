<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tarefas | StudyFlow</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>


<body
  class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 min-h-screen text-slate-100 font-sans overflow-x-hidden">


  <!-- ========================================
       EFEITOS DE FUNDO
  ======================================== -->

  <div
    class="fixed top-0 left-0 w-96 h-96 bg-blue-500/10 blur-3xl rounded-full pointer-events-none">
  </div>

  <div
    class="fixed bottom-0 right-0 w-96 h-96 bg-cyan-500/10 blur-3xl rounded-full pointer-events-none">
  </div>


  <!-- ========================================
       LAYOUT
  ======================================== -->

  <div class="flex min-h-screen relative z-10">


    <!-- ========================================
         MENU MOBILE
    ======================================== -->

    <div
      class="lg:hidden fixed top-0 left-0 right-0 z-50
             flex items-center justify-between
             p-4
             bg-slate-950/90
             backdrop-blur-xl
             border-b border-white/10">

      <div class="flex items-center gap-3">

        <img
          src="../assets/StudyFlow.2.png"
          alt="StudyFlow"
          class="mobile-brand-logo">

      </div>


      <button
        id="btnMenuTarefas"
        type="button"
        aria-label="Abrir menu"
        class="w-11 h-11
               flex items-center justify-center
               bg-white/5
               hover:bg-white/10
               border border-white/10
               rounded-xl
               transition">

        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round">

          <path d="M4 6h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 18h16"></path>

        </svg>

      </button>

    </div>


    <!-- ========================================
         SIDEBAR
    ======================================== -->

    <aside
      id="sidebarTarefas"
      class="hidden lg:flex
             sidebar-desktop
             bg-slate-950/90
             backdrop-blur-xl
             border-r border-white/10
             flex-col
             justify-between
             min-h-screen">


      <!-- ====================================
           PARTE SUPERIOR
      ==================================== -->

      <div class="sidebar-content">


        <!-- ====================================
             LOGOS
        ==================================== -->

        <div class="brand-container">

          <!-- Logo S - sidebar fechada -->

          <img
            src="../assets/StudyFlow.png"
            alt="StudyFlow"
            class="brand-logo-collapsed">


          <!-- Logo completa - sidebar aberta -->

          <img
            src="../assets/StudyFlow.2.png"
            alt="StudyFlow"
            class="brand-logo-expanded">

        </div>


        <!-- ====================================
             NAVEGAÇÃO
        ==================================== -->

        <nav class="sidebar-nav">


          <!-- DASHBOARD -->

          <a
            href="dashboard.html"
            class="sidebar-link"
            title="Dashboard">

            <svg
              class="sidebar-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round">

              <path d="M3 11.5L12 4l9 7.5"></path>
              <path d="M5.5 10v9h13v-9"></path>
              <path d="M9.5 19v-5h5v5"></path>

            </svg>

            <span class="sidebar-text">
              Dashboard
            </span>

          </a>


          <!-- TAREFAS -->

          <a
            href="tarefas.html"
            class="sidebar-link sidebar-link-active"
            title="Tarefas">

            <svg
              class="sidebar-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round">

              <rect
                x="4"
                y="3"
                width="16"
                height="18"
                rx="3">
              </rect>

              <path d="M8 8h.01"></path>
              <path d="M11 8h5"></path>

              <path d="M8 13l1.5 1.5L12 12"></path>
              <path d="M14 13h2"></path>

            </svg>

            <span class="sidebar-text">
              Tarefas
            </span>

          </a>


          <!-- CALENDÁRIO -->

          <a
            href="calendario.html"
            class="sidebar-link"
            title="Calendário">

            <svg
              class="sidebar-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round">

              <rect
                x="3"
                y="5"
                width="18"
                height="16"
                rx="3">
              </rect>

              <path d="M16 3v4"></path>
              <path d="M8 3v4"></path>

              <path d="M3 10h18"></path>

              <path d="M8 14h.01"></path>
              <path d="M12 14h.01"></path>
              <path d="M16 14h.01"></path>

            </svg>

            <span class="sidebar-text">
              Calendário
            </span>

          </a>


          <!-- POMODORO -->

          <a
            href="pomodoro.html"
            class="sidebar-link"
            title="Pomodoro">

            <svg
              class="sidebar-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round">

              <circle
                cx="12"
                cy="13"
                r="7">
              </circle>

              <path d="M12 9v4l2.5 1.5"></path>

              <path d="M9 3h6"></path>
              <path d="M12 3v2"></path>

            </svg>

            <span class="sidebar-text">
              Pomodoro
            </span>

          </a>


          <!-- STUDYFLOW AI -->

          <a
            href="ia.html"
            class="sidebar-link"
            title="StudyFlow AI">

            <svg
              class="sidebar-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round">

              <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"></path>

              <path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15z"></path>

            </svg>

            <span class="sidebar-text">
              StudyFlow AI
            </span>

          </a>


          <!-- MEU PERFIL -->

          <a
            href="materias.html"
            class="sidebar-link"
            title="Meu Perfil">

            <svg
              class="sidebar-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round">

              <circle
                cx="12"
                cy="8"
                r="3.5">
              </circle>

              <path
                d="M5 20c.8-3.3 3.3-5 7-5s6.2 1.7 7 5">
              </path>

            </svg>

            <span class="sidebar-text">
              Meu Perfil
            </span>

          </a>


          <!-- SAIR -->

          <a
            href="#"
            id="btnLogout"
            class="sidebar-link sidebar-link-logout"
            title="Sair">

            <svg
              class="sidebar-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round">

              <path d="M10 17l5-5-5-5"></path>
              <path d="M15 12H3"></path>

              <path
                d="M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5">
              </path>

            </svg>

            <span class="sidebar-text">
              Sair
            </span>

          </a>

        </nav>

      </div>


      <!-- ========================================
           PROGRESSO
      ======================================== -->

      <div class="sidebar-progress">

        <div class="flex justify-between items-center mb-3">

          <p class="text-sm text-slate-400">
            Progresso
          </p>

          <span class="text-cyan-300 text-sm font-semibold">
            75%
          </span>

        </div>


        <h2 class="text-3xl font-black">
          15/20
        </h2>


        <div
          class="w-full h-2 bg-slate-700/50 rounded-full mt-4 overflow-hidden">

          <div
            class="h-full w-[75%]
                   bg-gradient-to-r
                   from-blue-500
                   to-cyan-400
                   rounded-full">
          </div>

        </div>


        <p class="text-slate-500 text-xs mt-3">
          Você está quase terminando
        </p>

      </div>

    </aside>


    <!-- ========================================
         CONTEÚDO PRINCIPAL
    ======================================== -->

    <main
      class="flex-1
             min-w-0
             p-4 md:p-8
             pt-24 lg:pt-8
             overflow-y-auto">


      <!-- ====================================
           CABEÇALHO
      ==================================== -->

      <div
        class="flex
               items-center
               justify-between
               mb-10
               flex-wrap
               gap-4">

        <div>

          <p class="text-cyan-300 font-medium mb-2">
            Organize sua rotina
          </p>


          <h1
            class="text-3xl
                   md:text-5xl
                   font-black
                   leading-tight">

            Suas

            <span
              class="bg-gradient-to-r
                     from-blue-400
                     to-cyan-300
                     bg-clip-text
                     text-transparent">

              tarefas

            </span>

          </h1>

        </div>


        <!-- NOVA TAREFA -->

        <button
          id="btnNovaTarefa"
          type="button"
          class="w-full
                 sm:w-auto
                 bg-gradient-to-r
                 from-blue-500
                 to-cyan-400
                 hover:scale-[1.02]
                 transition
                 duration-300
                 px-7
                 py-4
                 rounded-2xl
                 font-bold
                 shadow-2xl
                 shadow-blue-500/20">

          + Nova tarefa

        </button>

      </div>


      <!-- ====================================
           LISTA DE TAREFAS
      ==================================== -->

      <section
        id="listaTarefas"
        class="space-y-6">

      </section>


      <!-- ====================================
           RESUMO
      ==================================== -->

      <section
        class="grid
               grid-cols-1
               md:grid-cols-3
               gap-5
               mt-8">


        <!-- TAREFAS CONCLUÍDAS -->

        <div
          class="bg-gradient-to-br
                 from-blue-500/20
                 to-cyan-400/10
                 backdrop-blur-xl
                 border border-white/10
                 rounded-3xl
                 p-6
                 shadow-2xl">

          <p class="text-slate-300 text-sm">
            Tarefas concluídas hoje
          </p>

          <h2
            class="text-5xl
                   font-black
                   mt-4
                   bg-gradient-to-r
                   from-blue-400
                   to-cyan-300
                   bg-clip-text
                   text-transparent">

            5

          </h2>

        </div>


        <!-- PRODUTIVIDADE -->

        <div
          class="bg-gradient-to-br
                 from-green-500/20
                 to-emerald-400/10
                 backdrop-blur-xl
                 border border-white/10
                 rounded-3xl
                 p-6
                 shadow-2xl">

          <p class="text-slate-300 text-sm">
            Produtividade
          </p>

          <h2
            class="text-5xl
                   font-black
                   mt-4
                   bg-gradient-to-r
                   from-green-400
                   to-emerald-300
                   bg-clip-text
                   text-transparent">

            89%

          </h2>

        </div>


        <!-- TEMPO ESTUDADO -->

        <div
          class="bg-gradient-to-br
                 from-purple-500/20
                 to-pink-400/10
                 backdrop-blur-xl
                 border border-white/10
                 rounded-3xl
                 p-6
                 shadow-2xl">

          <p class="text-slate-300 text-sm">
            Tempo estudado
          </p>

          <h2
            class="text-5xl
                   font-black
                   mt-4
                   bg-gradient-to-r
                   from-purple-400
                   to-pink-300
                   bg-clip-text
                   text-transparent">

            4h

          </h2>

        </div>

      </section>

    </main>

  </div>


  <!-- ========================================
       SCRIPTS
  ======================================== -->

  <script src="../js/tarefas.js"></script>
  <script src="../js/auth.js"></script>


  <!-- ========================================
       MENU MOBILE
  ======================================== -->

  <script>

    const btnMenuTarefas =
      document.getElementById("btnMenuTarefas");

    const sidebarTarefas =
      document.getElementById("sidebarTarefas");


    if (btnMenuTarefas && sidebarTarefas) {

      btnMenuTarefas.addEventListener("click", () => {

        sidebarTarefas.classList.toggle("mobile-open");

      });

    }

  </script>

</body>

</html>
```
